<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Registro Beta"><title>Registro Beta</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="../styles.css?v=beta-1.2.0"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon.svg"><style>#rmBetaBadge{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 10px);z-index:99999;border:0;border-radius:999px;background:#7b55ef;color:#fff;font:800 11px/1 -apple-system,BlinkMacSystemFont,sans-serif;padding:8px 12px;box-shadow:0 8px 24px #4b2ab855;-webkit-tap-highlight-color:transparent}#rmBetaPanel{position:fixed;z-index:100000;right:12px;top:calc(env(safe-area-inset-top) + 48px);width:min(300px,calc(100vw - 24px));padding:12px;border-radius:18px;background:#17171df2;color:#fff;border:1px solid #393943;box-shadow:0 18px 60px #0008;backdrop-filter:blur(20px);display:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#rmBetaPanel.open{display:block}#rmBetaPanel strong{display:block;font-size:15px;margin-bottom:5px}#rmBetaPanel p{margin:0 0 10px;color:#aaaab3;font-size:12px;line-height:1.4}#rmBetaPanel button,#rmBetaPanel a{display:block;width:100%;border:0;border-radius:12px;padding:10px 11px;margin-top:7px;text-align:center;text-decoration:none;font:700 13px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;background:#292933;color:#fff}#rmBetaPanel .primary{background:#7652e9}#rmBetaPanel .danger{background:#4b2020;color:#ff9b95}#topVersion{font-size:0!important}#topVersion::after{content:'BETA · 1.2.0';font-size:10px!important;color:#8c67f4}.rm-beta-loading{min-height:100dvh;display:grid;place-items:center;background:#0d0d10;color:#aaa;font:14px -apple-system,BlinkMacSystemFont,sans-serif}</style></head><body><div class="rm-beta-loading" id="rmBetaLoading">Preparando ambiente Beta…</div><script>(async()=>{'use strict';const BASE='/Registro-mental-v1/';const BETA_DB='registro-mental-beta-v1';const PROD_DB='registro-mental-v1';const rawOpen=indexedDB.open.bind(indexedDB);const rawDelete=indexedDB.deleteDatabase.bind(indexedDB);const rawGet=Storage.prototype.getItem;const rawSet=Storage.prototype.setItem;const rawRemove=Storage.prototype.removeItem;const rawClear=Storage.prototype.clear;window.__RM_BETA_RAW_OPEN=rawOpen;window.__RM_BETA_RAW_STORAGE={get:rawGet,set:rawSet,remove:rawRemove,clear:rawClear};const mapDb=n=>n===PROD_DB?BETA_DB:n;indexedDB.open=function(name,...args){return rawOpen(mapDb(String(name)),...args)};indexedDB.deleteDatabase=function(name){return rawDelete(mapDb(String(name)))};function mapKey(k){k=String(k);if(k.startsWith('registro-beta-'))return k;if(k==='registro-settings-v2')return'registro-beta-settings-v1';if(k.startsWith('registro-'))return'registro-beta-'+k.slice('registro-'.length);if(k.startsWith('rm-'))return'rm-beta-'+k.slice(3);return k}Storage.prototype.getItem=function(k){return rawGet.call(this,this===localStorage?mapKey(k):k)};Storage.prototype.setItem=function(k,v){return rawSet.call(this,this===localStorage?mapKey(k):k,v)};Storage.prototype.removeItem=function(k){return rawRemove.call(this,this===localStorage?mapKey(k):k)};Storage.prototype.clear=function(){if(this!==localStorage)return rawClear.call(this);const keys=[];for(let i=0;i<this.length;i++){const k=this.key(i);if(k&&(k.startsWith('registro-beta-')||k.startsWith('rm-beta-')))keys.push(k)}keys.forEach(k=>rawRemove.call(this,k))};const nativeAppend=document.head.appendChild.bind(document.head);document.head.appendChild=function(node){if(node&&node.tagName==='SCRIPT'){const attr=node.getAttribute('src');if(attr&&attr.startsWith('./'))node.src=BASE+attr.slice(2)}return nativeAppend(node)};const nativeFetch=window.fetch.bind(window);window.fetch=function(input,init){if(typeof input==='string'&&input.startsWith('./'))input=BASE+input.slice(2);return nativeFetch(input,init)};try{const response=await nativeFetch(BASE+'index.html?beta-shell='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('Não foi possível carregar a interface oficial como base.');const html=await response.text();const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script').forEach(s=>s.remove());document.body.innerHTML=doc.body.innerHTML;const badge=document.createElement('button');badge.id='rmBetaBadge';badge.type='button';badge.textContent='BETA';document.body.appendChild(badge);const panel=document.createElement('div');panel.id='rmBetaPanel';panel.innerHTML='<strong>Ambiente Beta</strong><p>Dados independentes do Oficial. Você pode testar, editar e apagar aqui sem alterar seus registros reais.</p><button class="primary" id="rmCopyProd">Copiar dados do Oficial</button><button class="danger" id="rmClearBeta">Limpar somente a Beta</button><a href="/Registro-mental-v1/menu.html">Abrir Menu</a>';document.body.appendChild(panel);badge.onclick=()=>panel.classList.toggle('open');async function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function openRaw(name){return new Promise((res,rej)=>{const r=rawOpen(name,2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('events')){const s=d.createObjectStore('events',{keyPath:'id'});s.createIndex('timestamp','timestamp');s.createIndex('type','type')}if(!d.objectStoreNames.contains('audio'))d.createObjectStore('audio',{keyPath:'id'});if(!d.objectStoreNames.contains('medications'))d.createObjectStore('medications',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function rows(db,n){if(!db.objectStoreNames.contains(n))return[];return req(db.transaction(n,'readonly').objectStore(n).getAll())}async function replace(db,n,data){if(!db.objectStoreNames.contains(n))return;return new Promise((res,rej)=>{const tx=db.transaction(n,'readwrite'),st=tx.objectStore(n);st.clear();for(const x of data)st.put(x);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}document.getElementById('rmCopyProd').onclick=async()=>{if(!confirm('Copiar seus dados atuais do Oficial para a Beta? A cópia ficará independente depois disso.'))return;const a=await openRaw(PROD_DB),b=await openRaw(BETA_DB);try{for(const n of ['events','audio','medications'])await replace(b,n,await rows(a,n));const st=rawGet.call(localStorage,'registro-settings-v2');if(st)rawSet.call(localStorage,'registro-beta-settings-v1',st);alert('Dados copiados para a Beta. O Oficial não será alterado.');location.reload()}finally{a.close();b.close()}};document.getElementById('rmClearBeta').onclick=async()=>{if(!confirm('Apagar somente os dados da Beta? Seus dados do Oficial não serão alterados.'))return;const b=await openRaw(BETA_DB);try{for(const n of ['events','audio','medications'])if(b.objectStoreNames.contains(n))await new Promise((res,rej)=>{const tx=b.transaction(n,'readwrite');tx.objectStore(n).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}finally{b.close()}for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&(k.startsWith('registro-beta-')||k.startsWith('rm-beta-')))rawRemove.call(localStorage,k)}alert('Beta limpa.');location.reload()};await new Promise((res,rej)=>{const s=document.createElement('script');s.src=BASE+'app.js?beta='+Date.now();s.onload=res;s.onerror=()=>rej(new Error('Falha ao carregar o motor do app.'));document.head.appendChild(s)});const enforce=()=>{const top=document.getElementById('topVersion');if(top)top.setAttribute('aria-label','Beta 1.2.0');document.documentElement.dataset.rmEnvironment='beta'};enforce();setTimeout(enforce,250);setTimeout(enforce,1000)}catch(err){console.error(err);document.body.innerHTML='<div class="rm-beta-loading"><div><strong style="display:block;color:#fff;margin-bottom:8px">A Beta não conseguiu abrir.</strong><span>'+String(err.message||err)+'</span><br><a style="color:#bca7ff;display:inline-block;margin-top:14px" href="/Registro-mental-v1/menu.html">Voltar ao Menu</a></div></div>'}})();</script></body></html>
