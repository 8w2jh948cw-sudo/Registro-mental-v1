<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d10"><title>Inicializando Beta</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0d0d10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.box{width:min(360px,86vw);text-align:center}.icon{width:76px;height:76px;border-radius:20px;margin:0 auto 18px}.icon img{width:100%}.bar{height:5px;background:#24242b;border-radius:999px;overflow:hidden;margin:18px 0}.bar:after{content:'';display:block;height:100%;width:100%;background:#8b67f4;animation:a .55s ease both}@keyframes a{from{transform:translateX(-100%)}to{transform:none}}small{color:#9d9da6}</style></head><body><div class="box"><div class="icon"><img src="./icon.svg" alt=""></div><strong>Registro Mental Beta</strong><div class="bar"></div><small id="s">Preparando ambiente de testes…</small></div><script>(async()=>{try{if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>/beta/i.test(k)).map(k=>caches.delete(k)))}document.getElementById('s').textContent='Abrindo Beta…'}catch{}setTimeout(()=>location.replace('/Registro-mental-v1/beta/?launch='+Date.now()),180)})();</script></body></html>
