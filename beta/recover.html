<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d10"><title>Recuperar Beta</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0d0d10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.box{width:min(380px,88vw);padding:22px;border:1px solid #303039;border-radius:22px;background:#18181e}.muted{color:#a0a0aa;font-size:13px;line-height:1.45}.ok{color:#8ee39a}a{display:block;margin-top:16px;padding:12px;border-radius:13px;background:#7652e9;color:white;text-align:center;text-decoration:none;font-weight:700}</style></head><body><div class="box"><h2>Recuperação da Beta</h2><p class="muted">Esta ferramenta limpa somente caches e controladores específicos da Beta. Não apaga o banco Oficial nem os registros pessoais.</p><p id="status" class="muted">Executando…</p><a id="open" href="/Registro-mental-v1/beta/">Abrir Beta</a></div><script>(async()=>{let notes=[];try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){if(r.scope.includes('/Registro-mental-v1/beta/')){await r.unregister();notes.push('service worker Beta removido')}}}if('caches'in window){const ks=await caches.keys();const bs=ks.filter(k=>/beta/i.test(k));await Promise.all(bs.map(k=>caches.delete(k)));if(bs.length)notes.push(bs.length+' cache(s) Beta removido(s)')}document.getElementById('status').className='muted ok';document.getElementById('status').textContent=notes.length?'Concluído: '+notes.join(', ')+'. Seus dados foram preservados.':'Ambiente já estava limpo. Seus dados foram preservados.'}catch(e){document.getElementById('status').textContent='Não foi possível limpar tudo: '+(e.message||e)+'. Nenhum comando de exclusão dos seus registros foi executado.'}})();</script></body></html>
