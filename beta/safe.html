<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d10"><title>Modo Seguro Beta</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>body{margin:0;background:#0d0d10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{width:min(100%,440px);margin:auto;padding:calc(28px + env(safe-area-inset-top)) 16px 40px}.card{background:#18181e;border:1px solid #303039;border-radius:20px;padding:16px;margin:12px 0}.muted{color:#9f9fa8;font-size:13px;line-height:1.45}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2a2a31}.metric:last-child{border:0}a,button{display:block;width:100%;margin-top:10px;padding:12px;border:0;border-radius:13px;background:#7652e9;color:#fff;text-decoration:none;text-align:center;font-weight:750}.secondary{background:#292932}</style></head><body><main><h1>Modo Seguro Beta</h1><p class="muted">Lê somente <strong>registro-mental-beta-v1</strong>. O banco Oficial não é aberto por esta página.</p><div class="card" id="stats"><div class="muted">Verificando banco Beta…</div></div><button id="backup" class="secondary">Exportar backup da Beta</button><a href="/Registro-mental-v1/beta/">Abrir Beta</a><a class="secondary" href="/Registro-mental-v1/menu.html">Voltar ao Menu</a></main><script>(()=>{const DB='registro-mental-beta-v1';let snapshot={};function open(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('events')){const s=d.createObjectStore('events',{keyPath:'id'});s.createIndex('timestamp','timestamp');s.createIndex('type','type')}if(!d.objectStoreNames.contains('audio'))d.createObjectStore('audio',{keyPath:'id'});if(!d.objectStoreNames.contains('medications'))d.createObjectStore('medications',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function all(db,n){return new Promise((res,rej)=>{if(!db.objectStoreNames.contains(n))return res([]);const r=db.transaction(n,'readonly').objectStore(n).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}(async()=>{try{const db=await open();for(const n of ['events','medications','audio'])snapshot[n]=await all(db,n);db.close();document.getElementById('stats').innerHTML='<div class="metric"><span>Registros</span><strong>'+snapshot.events.length+'</strong></div><div class="metric"><span>Medicamentos</span><strong>'+snapshot.medications.length+'</strong></div><div class="metric"><span>Áudios legados</span><strong>'+snapshot.audio.length+'</strong></div>'}catch(e){document.getElementById('stats').innerHTML='<div class="muted">Falha ao ler a Beta: '+(e.message||e)+'</div>'}})();document.getElementById('backup').onclick=()=>{const data={environment:'beta',database:DB,exportedAt:new Date().toISOString(),...snapshot};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='registro-mental-beta-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}})();</script></body></html>
