<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Recuperar Registro</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f5f7;color:#111114;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
    main{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    section{width:min(100%,380px);background:#fff;border-radius:22px;padding:22px;box-sizing:border-box;box-shadow:0 10px 30px rgba(0,0,0,.07)}
    h1{font-size:22px;margin:0 0 8px}p{font-size:14px;line-height:1.45;color:#6e6e73;margin:0}.ok{color:#238636}
  </style>
</head>
<body>
<main><section><h1>Recuperando o Registro</h1><p id="status">Removendo somente o cache da interface. Seus registros locais não serão apagados.</p></section></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs
        .filter(r=>String(r.scope||'').includes('/Registro-mental-v1/'))
        .map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys
        .filter(k=>k.startsWith('registro-v1-'))
        .map(k=>caches.delete(k)));
    }
    status.className='ok';
    status.textContent='Cache recuperado. Abrindo o app novamente…';
    setTimeout(()=>location.replace('./?recovered='+Date.now()),600);
  }catch(err){
    status.textContent='Não foi possível concluir automaticamente. Feche esta página e tente novamente.';
  }
})();
</script>
</body>
</html>
