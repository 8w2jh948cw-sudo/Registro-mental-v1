name: Fix Beta Safari Ultra beta.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-beta-safari-ultra-beta.5.yml'

permissions:
  contents: write

jobs:
  fix-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir viewport do Safari somente na Beta
        shell: bash
        run: |
          set -euo pipefail

          test -f beta/beta-patches.js
          ! grep -q 'RM_BETA_SAFARI_CHROME_FIX_V1' beta/beta-patches.js

          cat >> beta/beta-patches.js <<'EOF'

/* RM_BETA_SAFARI_CHROME_FIX_V1
   Mantém o chrome do Safari coerente com o tema sem reduzir os efeitos do modo Ultra. */
(() => {
  'use strict';

  const STYLE_ID = 'rm-beta-safari-chrome-fix-v1';
  const mqDark = window.matchMedia?.('(prefers-color-scheme: dark)');

  function ensureViewportStyle() {
    let style = document.getElementById(STYLE_ID);
    if (!style) {
      style = document.createElement('style');
      style.id = STYLE_ID;
      document.head.appendChild(style);
    }
    style.textContent = `
      html, body {
        background-color: var(--rm-safari-viewport-bg, var(--bg, #f5f5f7)) !important;
      }
    `;
  }

  function currentTheme() {
    const attr = document.documentElement.dataset.theme;
    if (attr === 'dark' || attr === 'light' || attr === 'system') return attr;
    try {
      const settings = typeof getSettings === 'function' ? getSettings() : null;
      if (settings?.theme === 'dark' || settings?.theme === 'light' || settings?.theme === 'system') return settings.theme;
    } catch (_) {}
    return 'system';
  }

  function syncSafariChrome() {
    ensureViewportStyle();
    const theme = currentTheme();
    const dark = theme === 'dark' || (theme === 'system' && Boolean(mqDark?.matches));
    const color = dark ? '#000000' : '#f5f5f7';
    const root = document.documentElement;

    root.style.setProperty('--rm-safari-viewport-bg', color);
    root.style.setProperty('background-color', color, 'important');
    if (document.body) document.body.style.setProperty('background-color', color, 'important');

    let meta = document.querySelector('meta[name="theme-color"]');
    if (!meta) {
      meta = document.createElement('meta');
      meta.name = 'theme-color';
      document.head.appendChild(meta);
    }
    meta.setAttribute('content', color);
  }

  const observer = new MutationObserver(syncSafariChrome);
  observer.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['data-theme', 'data-visual-mode']
  });

  try { mqDark?.addEventListener?.('change', syncSafariChrome); } catch (_) {}
  document.addEventListener('registro:release-ready', syncSafariChrome);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', syncSafariChrome, { once: true });
  else syncSafariChrome();
  requestAnimationFrame(syncSafariChrome);
})();
EOF

          version_files=(
            beta/beta-tools.js
            beta/boot.js
            beta/environment.json
            beta/index.html
            beta/launch.html
            beta/manifest.webmanifest
            beta/patches.js
            beta/recover.html
            beta/safe.html
            beta/sw.js
          )

          for f in "${version_files[@]}"; do
            test -f "$f"
            grep -q '1.2.0-beta.4' "$f"
            sed -i 's/1\.2\.0-beta\.4/1.2.0-beta.5/g' "$f"
          done

          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 11
          for f in "${changed[@]}"; do
            case "$f" in
              beta/beta-patches.js|beta/beta-tools.js|beta/boot.js|beta/environment.json|beta/index.html|beta/launch.html|beta/manifest.webmanifest|beta/patches.js|beta/recover.html|beta/safe.html|beta/sw.js) ;;
              *) echo "Arquivo inesperado alterado: $f"; exit 1 ;;
            esac
          done

          grep -q 'RM_BETA_SAFARI_CHROME_FIX_V1' beta/beta-patches.js
          grep -q '1.2.0-beta.5' beta/environment.json
          grep -q '1.2.0-beta.5' beta/index.html

          git config user.name 'Vinicius'
          git config user.email '8w2jh948cw@privaterelay.appleid.com'
          git add -- "${changed[@]}"
          git commit -m 'Beta 1.2.0-beta.5: corrige barras brancas do Safari no Ultra'
          git push origin HEAD:main
