name: Publicar Registro Mental V1

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-v1"
  cancel-in-progress: false

env:
  RELEASE: "1.0.6"

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da V1
        uses: actions/checkout@v4

      - name: Buscar somente a fonte congelada da migração inicial
        uses: actions/checkout@v4
        with:
          repository: 8w2jh948cw-sudo/Registro-mental-pwa
          ref: 0b6094c7b78debd00f2a8ca327087f73966a17c0
          path: _legacy
          persist-credentials: false

      - name: Montar base limpa
        run: python3 build_v1.py

      - name: Aplicar atualização 1.0.6
        run: |
          sed -i "s/1\.0\.0/${RELEASE}/g" site/index.html site/app.js site/sw.js site/release-guard.js
          printf '\n' >> site/app.js
          cat v1-learning-icon.js >> site/app.js
          cp -f recover.html site/recover.html

      - name: Sincronizar site na raiz do repositório
        run: |
          cp -f site/index.html ./index.html
          cp -f site/styles.css ./styles.css
          cp -f site/app.js ./app.js
          cp -f site/manifest.webmanifest ./manifest.webmanifest
          cp -f site/sw.js ./sw.js
          cp -f site/release-guard.js ./release-guard.js
          cp -f site/.nojekyll ./.nojekyll
          for file in SHORTCUT-SLEEP.txt v04demo.js v04tabbar.js v04navicons.js tabbar-lab.html tabbar-editor.html dev-editor.html preview-escala-humor.html; do
            [ -f "site/$file" ] && cp -f "site/$file" "./$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css app.js manifest.webmanifest sw.js release-guard.js .nojekyll SHORTCUT-SLEEP.txt v04demo.js v04tabbar.js v04navicons.js tabbar-lab.html tabbar-editor.html dev-editor.html preview-escala-humor.html recover.html
          if ! git diff --cached --quiet; then
            git commit -m "Sincroniza site publicado ${RELEASE} na raiz [skip ci]"
            git push
          fi

      - name: Habilitar e configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar site consolidado
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
