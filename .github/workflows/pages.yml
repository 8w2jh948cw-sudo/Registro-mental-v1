name: Publicar Registro Mental

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-registro-mental"
  cancel-in-progress: true

env:
  STABLE_RELEASE: "1.1.1"
  BETA_BUILD_RELEASE: "1.2.0"
  BETA_LABEL: "1.2.0-beta.1"

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do desenvolvimento
        uses: actions/checkout@v4

      - name: Checkout da versão Oficial congelada
        uses: actions/checkout@v4
        with:
          ref: stable
          path: _stable
          persist-credentials: false

      - name: Montar Beta a partir do desenvolvimento
        run: |
          RELEASE=${BETA_BUILD_RELEASE} python3 prepare_release.py
          rm -rf _beta_site
          mv site _beta_site

      - name: Montar Oficial a partir da branch stable
        run: |
          cd _stable
          RELEASE=${STABLE_RELEASE} python3 prepare_release.py
          cd ..
          rm -rf site
          cp -a _stable/site site

      - name: Criar ambientes isolados
        run: |
          python3 prepare_environments.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('site/beta/manifest.webmanifest')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['id']='./'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Aplicar ícones dos ambientes
        run: python3 prepare_icons.py

      - name: Criar menu central de links
        run: python3 prepare_menu.py

      - name: Conferir Oficial Beta Diagnóstico e Menu
        run: |
          test -s site/index.html
          test -s site/boot.js
          test -s site/app.js
          test -s site/launch.html
          test -s site/safe.html
          test -s site/recover.html
          test -s site/icon.svg
          test -s site/beta/index.html
          test -s site/beta/app.js
          test -s site/beta/beta-tools.js
          test -s site/beta/beta-patches.js
          test -s site/beta/icon.svg
          test -s site/diagnostico/index.html
          test -s site/menu/index.html
          grep -q 'rmStableReleaseStamp' site/index.html
          grep -q 'registro-mental-beta-v1' site/beta/app.js
          ! grep -q "const DB_NAME='registro-mental-v1'" site/beta/app.js
          grep -q 'DADOS ISOLADOS' site/diagnostico/index.html
          grep -q 'Central de Diagnóstico' site/menu/index.html
          grep -q '../beta/icon.svg' site/menu/index.html
          grep -q 'image/svg+xml' site/manifest.webmanifest
          grep -q 'image/svg+xml' site/beta/manifest.webmanifest
          grep -q '>BETA</text>' site/beta/icon.svg
          ! grep -q '>BETA</text>' site/icon.svg
          echo "Oficial ${STABLE_RELEASE} congelado; Beta ${BETA_LABEL} isolada; Menu e ícones publicados."

      - name: Habilitar e configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar site completo
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
