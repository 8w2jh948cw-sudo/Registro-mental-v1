name: Validar site público do Registro Mental

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "registro-mental-validacao-main"
  cancel-in-progress: true

jobs:
  validate-public-site:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a versão publicada
        uses: actions/checkout@v4

      - name: Validar arquivos, versões e identidade dos ambientes
        run: |
          test -s index.html
          test -s app.js
          test -s menu.html
          test -s menu/index.html
          test -s diagnostico/index.html
          test -s beta/index.html
          test -s beta/app.js
          test -s beta/manifest.webmanifest
          test -s mood-scale-10.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          environments = json.loads(Path('ambientes.json').read_text(encoding='utf-8'))
          beta_manifest = json.loads(Path('beta/manifest.webmanifest').read_text(encoding='utf-8'))
          assert environments['official']['release'] == '1.1.10'
          assert environments['beta']['release'] == '1.2.0-beta.14'
          assert environments['official']['database'] == 'registro-mental-v1'
          assert environments['beta']['database'] == 'registro-mental-beta-v1'
          assert beta_manifest['id'] == './'
          PY

      - name: Validar JavaScript e módulos incorporados
        run: |
          find . -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          for (const file of ['app.js', 'beta/app.js']) {
            const source = fs.readFileSync(file, 'utf8');
            const modules = [...source.matchAll(/s\.text=("(?:[^"\\]|\\.)*");document\.head\.appendChild/g)];
            if (modules.length < 30) throw new Error(`${file}: apenas ${modules.length} módulos incorporados encontrados.`);
            modules.forEach((match, index) => new vm.Script(JSON.parse(match[1]), { filename: `${file}#${index + 1}` }));
            const releaseGlobals = [...source.matchAll(/\\nconst ([A-Za-z][A-Za-z0-9]*)=document\.getElementById\('topVersion'\)/g)].map(match => match[1]);
            if (releaseGlobals.includes('top')) {
              throw new Error(`${file}: declaração global incompatível com window.top.`);
            }
            if (new Set(releaseGlobals).size !== releaseGlobals.length) {
              throw new Error(`${file}: identificador global de versão repetido entre módulos.`);
            }
            if (!source.includes('while(!db&&attempts<200)')) {
              throw new Error(`${file}: migração emocional não aguarda o banco local.`);
            }
            if (file === 'beta/app.js' && source.includes("const VERSION = '1.2.0';")) {
              throw new Error(`${file}: motor Beta voltou a anunciar a versão estável.`);
            }
          }
          NODE

      - name: Validar links internos e impedir endereços antigos
        run: |
          if rg -n '8w2jh948cw-sudo|Registro-mental-pwa' .; then
            echo 'Foi encontrado um endereço antigo do projeto.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('href', 'src'):
                      if key in attrs:
                          self.values.append(attrs[key])

          root = Path('.').resolve()
          missing = []
          for html in root.rglob('*.html'):
              parser = Links()
              parser.feed(html.read_text(encoding='utf-8'))
              for raw in parser.values:
                  parsed = urlsplit(raw)
                  if parsed.scheme or parsed.netloc or not parsed.path or parsed.path.startswith(('#', 'data:')):
                      continue
                  target = (html.parent / parsed.path).resolve()
                  if target.is_dir():
                      target = target / 'index.html'
                  if not target.exists():
                      missing.append(f'{html.relative_to(root)} -> {raw}')
          if missing:
              raise SystemExit('Links internos ausentes:\n' + '\n'.join(missing))
          PY
