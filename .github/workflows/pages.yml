name: Publicar Registro Mental V1

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-v1"
  cancel-in-progress: true

env:
  RELEASE: "1.1.1"

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da V1
        uses: actions/checkout@v4

      - name: Preparar release autossuficiente
        run: python3 prepare_release.py

      - name: Conferir arquivos críticos
        run: |
          test -s site/index.html
          test -s site/boot.js
          test -s site/app.js
          test -s site/patches.js
          test -s site/launch.html
          test -s site/safe.html
          test -s site/recover.html
          grep -q 'rmBoot' site/index.html
          grep -q "boot.js?v=${RELEASE}" site/index.html
          ! grep -q 'navigator.serviceWorker.register' site/app.js
          echo "Release ${RELEASE} validada antes da publicação."

      - name: Habilitar e configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
