name: Sincronizar site público do Registro Mental

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - ".publish-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "registro-mental-publicacao-main"
  cancel-in-progress: true

env:
  STABLE_RELEASE: "1.1.1"
  BETA_BUILD_RELEASE: "1.2.0"
  BETA_LABEL: "1.2.0-beta.1"

jobs:
  build-and-sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da main que o Pages realmente publica
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout do código de desenvolvimento
        uses: actions/checkout@v4
        with:
          ref: development
          path: _dev
          persist-credentials: false

      - name: Checkout da versão Oficial congelada
        uses: actions/checkout@v4
        with:
          ref: stable
          path: _stable
          persist-credentials: false

      - name: Montar Beta a partir de development
        run: |
          cd _dev
          RELEASE=${BETA_BUILD_RELEASE} python3 prepare_release.py
          rm -rf _beta_site
          mv site _beta_site

      - name: Montar Oficial a partir de stable
        run: |
          cd _stable
          RELEASE=${STABLE_RELEASE} python3 prepare_release.py

      - name: Montar pacote público completo dentro de development
        run: |
          rm -rf _dev/site
          cp -a _stable/site _dev/site
          cd _dev
          python3 prepare_environments.py
          cp beta-sheet-actions.js site/beta/beta-sheet-actions.js
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('site/beta/index.html')
          text=p.read_text(encoding='utf-8')
          tag=f'<script src="./beta-sheet-actions.js?v={os.environ["BETA_LABEL"]}" defer></script>'
          if 'beta-sheet-actions.js' not in text:
              text=text.replace('</body>', tag+'\n</body>', 1)
          p.write_text(text,encoding='utf-8')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('site/beta/manifest.webmanifest')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['id']='./'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 prepare_icons.py
          python3 prepare_menu.py

      - name: Validar Beta isolada e arquivos essenciais
        run: |
          test -s _dev/site/index.html
          test -s _dev/site/menu.html
          test -s _dev/site/menu/index.html
          test -s _dev/site/diagnostico/index.html
          test -s _dev/site/beta/index.html
          test -s _dev/site/beta/app.js
          test -s _dev/site/beta/beta-sheet-actions.js
          grep -q 'registro-mental-beta-v1' _dev/site/beta/app.js
          ! grep -q "const DB_NAME='registro-mental-v1'" _dev/site/beta/app.js
          grep -q 'beta-sheet-actions.js' _dev/site/beta/index.html
          grep -q 'Central de Diagnóstico' _dev/site/menu.html
          ! grep -q 'url=./menu.html' _dev/site/menu.html
          echo "Beta isolada, Menu real e pacote essencial validados."

      - name: Substituir os arquivos públicos da main pelo pacote validado
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name _dev \
            ! -name _stable \
            -exec rm -rf {} +
          cp -a _dev/site/. ./
          rm -rf _dev _stable

      - name: Confirmar pacote que será servido
        run: |
          test -s index.html
          test -s menu.html
          test -s menu/index.html
          test -s beta/index.html
          test -s beta/app.js
          test -s beta/beta-sheet-actions.js
          grep -q 'registro-mental-beta-v1' beta/app.js
          grep -q 'beta-sheet-actions.js' beta/index.html
          grep -q 'Central de Diagnóstico' menu.html
          ! grep -q 'url=./menu.html' menu.html
          echo "main pronta para o Pages com Menu independente validado."

      - name: Gravar pacote público na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pública pendente."
          else
            git commit -m "chore(pages): publica Oficial Beta Menu e Diagnóstico [skip ci]"
            git push origin main
          fi
