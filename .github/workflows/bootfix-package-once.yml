# execução única disparada em 2026-09-09
name: Corrigir boot e empacotar PWA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootfix-package-once.yml'

permissions:
  contents: write

jobs:
  fix-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir boot, diagnóstico e cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Padrão não encontrado: {label}')
              return text.replace(old, new, 1)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          hidden_css = '#rmBootActions[hidden],#rmBootDiagnostics[hidden]{display:none!important}'
          if hidden_css not in s:
              s = replace_once(s,'#rmBoot.rm-boot-hide{opacity:0;visibility:hidden;pointer-events:none}','#rmBoot.rm-boot-hide{opacity:0;visibility:hidden;pointer-events:none}\n  '+hidden_css,'CSS hidden oficial')
          s = re.sub(r'<script src="\./boot\.js\?v=[^"]+" defer></script>','<script src="./boot.js?v=1.1.10-bootfix2" defer></script>',s,count=1)
          p.write_text(s,encoding='utf-8')

          p = Path('beta/index.html')
          s = p.read_text(encoding='utf-8')
          if hidden_css not in s:
              s = replace_once(s,'#rmBoot.rm-boot-hide{opacity:0;visibility:hidden;pointer-events:none}','#rmBoot.rm-boot-hide{opacity:0;visibility:hidden;pointer-events:none}\n  '+hidden_css,'CSS hidden beta')
          s = re.sub(r'<script src="\./boot\.js\?v=[^"]+" defer></script>','<script src="./boot.js?v=1.2.0-beta.14-bootfix2" defer></script>',s,count=1)
          p.write_text(s,encoding='utf-8')

          p = Path('boot.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const RELEASE = '1.1.8';","const RELEASE = '1.1.10';",1)
          old_func = """  function appLooksFunctional() {
    const shell = document.querySelector('.app-shell');
    const tabbar = document.querySelector('.tab-bar');
    const action = document.querySelector('.action-card');
    const hasCoreFunctions = typeof window.renderAll === 'function' || typeof window.openDB === 'function';
    return Boolean(shell && tabbar && action && hasCoreFunctions);
  }
"""
          new_func = """  function appLooksFunctional() {
    const shell = document.querySelector('.app-shell');
    const content = document.getElementById('content') || document.querySelector('.content');
    const activeView = document.querySelector('.view.active');
    const tabbar = document.querySelector('.tab-bar,.capsule-tabbar');
    const action = document.querySelector('.action-card');
    const visible = node => {
      if (!node) return false;
      try {
        const st = getComputedStyle(node);
        const r = node.getBoundingClientRect();
        const opacity = Number.parseFloat(st.opacity || '1');
        return st.display !== 'none' && st.visibility !== 'hidden' && !(Number.isFinite(opacity) && opacity <= .01) && r.width > 40 && r.height > 24;
      } catch (_) { return true; }
    };
    return Boolean(visible(shell) && visible(content) && visible(activeView) && visible(tabbar) && action);
  }
"""
          s = replace_once(s,old_func,new_func,'appLooksFunctional oficial')
          pattern = re.compile(r"  copyButton\?\.addEventListener\('click', async \(\) => \{.*?\n  \}\);",re.S)
          replacement = """  copyButton?.addEventListener('click', async () => {
    const payload = lastDiagnosticPayload || buildDiagnostic('Diagnóstico solicitado manualmente');
    persistDiagnostic(payload);
    if (diagnostics) { diagnostics.hidden = false; diagnostics.textContent = payload; diagnostics.setAttribute('tabindex','0'); }
    let ok = false;
    try { if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(payload); ok = true; } } catch (_) {}
    if (!ok) ok = fallbackCopy(payload);
    if (copyButton) copyButton.textContent = ok ? 'Diagnóstico copiado' : 'Texto exibido abaixo';
    if (!ok && diagnostics) { try { const range=document.createRange(); range.selectNodeContents(diagnostics); const selection=window.getSelection(); selection.removeAllRanges(); selection.addRange(range); } catch (_) {} }
  });"""
          s,n = pattern.subn(replacement,s,count=1)
          if n != 1: raise SystemExit('Handler copiar diagnóstico oficial não encontrado')
          p.write_text(s,encoding='utf-8')

          p = Path('beta/boot.js')
          s = p.read_text(encoding='utf-8')
          old_func_beta = """  function appLooksFunctional() {
    const shell = document.querySelector('.app-shell'), tabbar = document.querySelector('.tab-bar'), action = document.querySelector('.action-card');
    const hasCoreFunctions = typeof window.renderAll === 'function' || typeof window.openDB === 'function';
    return Boolean(shell && tabbar && action && hasCoreFunctions);
  }
"""
          new_func_beta = """  function appLooksFunctional() {
    const shell = document.querySelector('.app-shell');
    const content = document.getElementById('content') || document.querySelector('.content');
    const activeView = document.querySelector('.view.active');
    const tabbar = document.querySelector('.tab-bar,.capsule-tabbar');
    const action = document.querySelector('.action-card');
    const visible = node => {
      if (!node) return false;
      try {
        const st = getComputedStyle(node);
        const r = node.getBoundingClientRect();
        const opacity = Number.parseFloat(st.opacity || '1');
        return st.display !== 'none' && st.visibility !== 'hidden' && !(Number.isFinite(opacity) && opacity <= .01) && r.width > 40 && r.height > 24;
      } catch (_) { return true; }
    };
    return Boolean(visible(shell) && visible(content) && visible(activeView) && visible(tabbar) && action);
  }
"""
          s = replace_once(s,old_func_beta,new_func_beta,'appLooksFunctional beta')
          pattern_beta = re.compile(r"  copyButton\?\.addEventListener\('click', async \(\) => \{.*?\n  \}\);",re.S)
          replacement_beta = """  copyButton?.addEventListener('click', async () => {
    const payload = [`Registro Mental ${RELEASE}`, `URL: ${location.href}`, `Standalone: ${window.matchMedia?.('(display-mode: standalone)')?.matches ? 'sim' : 'não'}`, `Controlado por Service Worker ao abrir: ${hadControllerAtStart ? 'sim' : 'não'}`, `Controlador residual agora: ${navigator.serviceWorker?.controller ? 'sim' : 'não'}`, `Online: ${navigator.onLine ? 'sim' : 'não'}`, `User agent: ${navigator.userAgent}`, '', ...window.__RM_BOOT_DIAGNOSTICS.map(item => `${item.t}ms ${item.kind}: ${item.message}${item.extra ? ` — ${item.extra}` : ''}`)].join('\\n');
    if (diagnostics) { diagnostics.hidden = false; diagnostics.textContent = payload; diagnostics.setAttribute('tabindex','0'); }
    copyButton.disabled = true; copyButton.textContent = 'Copiando…';
    let copied = false;
    try { if (navigator.clipboard?.writeText) { await withTimeout(navigator.clipboard.writeText(payload),1200,'Cópia do diagnóstico'); copied = true; } } catch (_) {}
    if (!copied) copied = copyTextLegacy(payload);
    copyButton.textContent = copied ? 'Diagnóstico copiado' : 'Texto exibido abaixo';
    if (!copied && diagnostics) { try { const range=document.createRange(); range.selectNodeContents(diagnostics); const selection=window.getSelection(); selection.removeAllRanges(); selection.addRange(range); } catch (_) {} }
    setTimeout(()=>{ copyButton.disabled=false; copyButton.textContent='Copiar diagnóstico'; },2400);
  });"""
          s,n = pattern_beta.subn(replacement_beta,s,count=1)
          if n != 1: raise SystemExit('Handler copiar diagnóstico beta não encontrado')
          p.write_text(s,encoding='utf-8')

          p = Path('official-appearance.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const RELEASE = '1.1.9';","const RELEASE = '1.1.10';",1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commitar correções
        shell: bash
        run: |
          git config user.name "Vinicius"
          git config user.email "viniciusnevez123@gmail.com"
          git add index.html boot.js beta/index.html beta/boot.js official-appearance.js
          if ! git diff --cached --quiet; then
            git commit -m "Corrige travamento do boot e cópia de diagnóstico"
            git push origin main
          fi

      - name: Criar ZIP do PWA
        shell: bash
        run: |
          rm -f Registro-Mental-PWA-1.1.10.zip
          zip -r Registro-Mental-PWA-1.1.10.zip . -x '.git/*' -x 'Registro-Mental-PWA-1.1.10.zip'

      - name: Publicar ZIP como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Registro-Mental-PWA-1.1.10
          path: Registro-Mental-PWA-1.1.10.zip
          if-no-files-found: error
          retention-days: 30
