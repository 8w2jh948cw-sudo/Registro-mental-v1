name: Bump Beta 1.2.0-beta.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-beta-1.2.0-beta.4.yml'

permissions:
  contents: write

jobs:
  bump-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar somente a Beta
        shell: bash
        run: |
          set -euo pipefail
          files=(
            beta/beta-tools.js
            beta/boot.js
            beta/environment.json
            beta/index.html
            beta/launch.html
            beta/manifest.webmanifest
            beta/patches.js
            beta/recover.html
            beta/safe.html
            beta/sw.js
          )

          for f in "${files[@]}"; do
            test -f "$f"
            grep -q '1.2.0-beta.3' "$f"
          done

          protected_before="$(git hash-object beta/beta-patches.js)"

          for f in "${files[@]}"; do
            sed -i 's/1\.2\.0-beta\.3/1.2.0-beta.4/g' "$f"
          done

          protected_after="$(git hash-object beta/beta-patches.js)"
          test "$protected_before" = "$protected_after"
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq "${#files[@]}"
          for f in "${changed[@]}"; do
            case "$f" in
              beta/beta-tools.js|beta/boot.js|beta/environment.json|beta/index.html|beta/launch.html|beta/manifest.webmanifest|beta/patches.js|beta/recover.html|beta/safe.html|beta/sw.js) ;;
              *) echo "Arquivo inesperado alterado: $f"; exit 1 ;;
            esac
          done

          git config user.name 'Vinicius'
          git config user.email '8w2jh948cw@privaterelay.appleid.com'
          git add -- "${files[@]}"
          git commit -m 'Publica Beta 1.2.0-beta.4 sem alterar o Oficial'
          git push origin HEAD:main
